<script>
(function () {
  var box = document.getElementById("taama-role");
  var choice = "client";
  var hints = { client: "Réserver un bus, un vol, un hôtel, une voiture, un taxi…",
                partner: "Hôtel, transport, agence… : gérer mes offres, réservations et revenus" };
  var cards = box.querySelectorAll(".tr-card");
  function select(role) {
    choice = role;
    Array.prototype.forEach.call(cards, function (x) { x.classList.toggle("sel", x.getAttribute("data-role") === role); });
    document.getElementById("tr-hint").textContent = hints[role];
  }
  Array.prototype.forEach.call(cards, function (c) {
    c.addEventListener("click", function () { select(c.getAttribute("data-role")); });
  });
  document.getElementById("tr-go").addEventListener("click", function () {
    try { localStorage.setItem("taama_role", choice); } catch (e) {}
    if (choice === "partner") location.replace("/partenaire/");
    else { box.hidden = true; document.body.classList.remove("role-open"); window.dispatchEvent(new Event("taama-role-change")); }
  });
  // Retour à l'écran de choix (bouton ← de l'écran de connexion)
  window.taamaShowRoleChooser = function () {
    try { localStorage.removeItem("taama_role"); } catch (e) {}
    select("client");
    box.hidden = false; document.body.classList.add("role-open");
    window.dispatchEvent(new Event("taama-role-change"));
  };

  var role = null, hasClient = false;
  try { role = localStorage.getItem("taama_role"); hasClient = !!localStorage.getItem("taama_client_token"); } catch (e) {}
  if (role === "partner") { location.replace("/partenaire/"); return; }
  if (role === "client" || hasClient) return;
  box.hidden = false; document.body.classList.add("role-open");
})();
</script>

<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

// Adresse du backend Taama. Modifie cette valeur si ton API tourne ailleurs
// (ex. une URL Railway/Render une fois déployée).
const API_BASE = "https://taama-backend-production.up.railway.app";

// Barème commercial Taifa/Taama. La commission est prélevée sur la part partenaire,
// pas ajoutée au total affiché au client. Le calcul définitif doit être fait côté backend.
const TAAMA_COMMISSION_RATES = {
  bus: 0.08, hotel: 0.12, flight: 0.05, car_rental: 0.10, vehicle: 0.10, insurance: 0.15, apartment: 0.10, ticket: 0.08, taxi: 0.10
};
function listingTypeFromItem(item) {
  return item?.mode === 'hotel' ? 'hotel' : item?.mode === 'apartment' ? 'apartment' : item?.mode === 'vehicle' ? 'vehicle' : item?.mode === 'vol' ? 'flight' : item?.mode === 'assurance' ? 'insurance' : item?.mode === 'bus' ? 'bus' : item?.mode === 'taxi' ? 'taxi' : 'ticket';
}

// Grille tarifaire indicative des courses taxi/moto-taxi, par type de véhicule et distance.
// À ajuster une fois les tarifs réels des partenaires taxi confirmés.
const TAXI_PRICES = {
  moto: { courte: 1500, moyenne: 2500, longue: 4000 },
  voiture: { courte: 2500, moyenne: 4000, longue: 7000 },
};
const TAXI_DISTANCE_LABELS = { courte: "Courte (< 5 km)", moyenne: "Moyenne (5–15 km)", longue: "Longue (> 15 km)" };
function commissionPreview(item, total) {
  const rate = TAAMA_COMMISSION_RATES[listingTypeFromItem(item)] ?? 0.10;
  const amount = Math.round(Number(total || 0) * rate);
  return { rate, amount, partnerNet: Math.max(0, Number(total || 0) - amount) };
}

// Numéro de la centrale Taama à appeler pour la remise des véhicules / mise en relation chauffeur,
// notamment utile pour les clients qui arrivent de l'étranger.
const TAAMA_DISPATCH_PHONE = "+223 70 00 00 00";

async function apiCall(path, options = {}) {
  const res = await fetch(API_BASE + path, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      ...(options.headers || {}),
    },
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.error || "Erreur réseau");
    err.status = res.status;
    throw err;
  }
  return data;
}

function formatFCFA(n) {
  const num = Number(n || 0);
  return num.toLocaleString("fr-FR").replace(/,/g, " ") + " FCFA";
}

// Récupère les offres réelles (validées par l'admin) pour un type donné,
// et les transforme dans le format attendu par les écrans existants.
async function fetchListings(type) {
  const rows = await apiCall(`/listings?type=${type}`);
  return rows.map((l) => {
    const m = l.metadata || {};
    return {
      id: l.id,
      name: l.title,
      title: l.title,
      zone: m.city || "",
      city: m.city || "",
      address: m.address || "",
      stars: m.room_type || "",
      price: formatFCFA(l.price_fcfa),
      priceRaw: l.price_fcfa,
      photo: l.image_url || null,
      amenities: [],
      rating: null,
      reviews: [],
      conditions: m.conditions || "",
      availability: m.availability || "",
      agency: l.partner_name || "",
      // champs billets/transport
      company: l.title,
      depart: m.time || "",
      arrive: "",
      detail: [m.departure, m.destination].filter(Boolean).join(" → "),
      // champs véhicule
      type_vehicule: m.room_type || "",
      sans: formatFCFA(l.price_fcfa),
      avec: formatFCFA(l.price_fcfa),
      deposit: m.deposit || "",
    };
  });
}

function Photo({ src, fallbackColor, className, children }) {
  const [broken, setBroken] = useState(false);
  return (
    <div className={"relative overflow-hidden " + className} style={{ background: fallbackColor }}>
      {!broken && (
        <img
          src={src}
          onError={() => setBroken(true)}
          className="absolute inset-0 w-full h-full object-cover"
          alt=""
        />
      )}
      <div className="absolute inset-0" style={{ background: "linear-gradient(180deg, rgba(27,42,74,0.05) 0%, rgba(27,42,74,0.55) 100%)" }} />
      <div className="relative h-full">{children}</div>
    </div>
  );
}

function Login({ onLoggedIn }) {
  const [nom, setNom] = useState("");
  const [prenoms, setPrenoms] = useState("");
  const [phone, setPhone] = useState("+223 ");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);

  const canSubmit = nom.trim() && prenoms.trim() && phone.replace(/\s/g, "").length > 4;

  const submit = async () => {
    setError(null);
    if (!canSubmit) {
      setError("Merci de remplir le nom, le(s) prénom(s) et le numéro de téléphone.");
      return;
    }
    setLoading(true);
    try {
      // Connexion en une étape : nom + prénom(s) + téléphone, sans code de vérification.
      // Si le numéro existe déjà, le backend reconnecte le même compte ; sinon il le crée.
      const data = await apiCall("/auth/simple-login", {
        method: "POST",
        body: JSON.stringify({
          nom: nom.trim(),
          prenoms: prenoms.trim(),
          phone: phone.replace(/\s/g, ""),
        }),
      });
      onLoggedIn(data.token, data.user);
    } catch (e) {
      // On n'invente plus de session locale : sans vrai compte, toutes les
      // réservations échouaient ensuite. On affiche l'erreur à l'utilisateur.
      setError(e.message || "Connexion impossible pour le moment. Réessaie dans quelques instants.");
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="pb-8 px-5 pt-6 flex flex-col items-center text-center">
      <button
        type="button"
        onClick={() => window.taamaShowRoleChooser && window.taamaShowRoleChooser()}
        aria-label="Retour au choix du profil"
        className="self-start mb-6"
        style={{ color: "#FFFFFF", fontSize: 26, lineHeight: 1, background: "none", border: "none", padding: "6px 4px", cursor: "pointer" }}
      >←</button>
      <div className="mb-8">
        <div style={{ fontWeight: 700, fontSize: 24, color: "#FFFFFF" }}>Connexion</div>
        <div style={{ fontSize: 14, color: "#9AA6BD", marginTop: 6 }}>Entrez vos informations pour réserver</div>
      </div>

      <div className="w-full flex flex-col gap-3">
        <Field label="Nom">
          <input
            value={nom}
            onChange={(e) => setNom(e.target.value)}
            className="w-full text-sm outline-none bg-transparent"
            style={{ color: "#1B2A4A" }}
          />
        </Field>
        <Field label="Prénom(s)">
          <input
            value={prenoms}
            onChange={(e) => setPrenoms(e.target.value)}
            className="w-full text-sm outline-none bg-transparent"
            style={{ color: "#1B2A4A" }}
          />
        </Field>
        <Field label="Numéro de téléphone">
          <input
            value={phone}
            onChange={(e) => setPhone(e.target.value)}
            className="w-full text-sm outline-none bg-transparent"
            style={{ color: "#1B2A4A" }}
          />
        </Field>
        <button
          onClick={submit}
          disabled={loading}
          className="rounded-xl py-3 mt-2"
          style={{ background: "#1B2A4A", opacity: loading ? 0.7 : 1 }}
        >
          <span className="text-white text-sm font-medium">
            {loading ? "Connexion en cours…" : "Se connecter"}
          </span>
        </button>
        <p className="text-[11px]" style={{ color: "#FFFFFFb3" }}>
          Une fois connecté, tu resteras connecté sur cet appareil — plus besoin de ressaisir tes infos à chaque visite.
        </p>
      </div>

      {error && <p className="text-xs mt-3" style={{ color: "#A63D2F" }}>{error}</p>}
    </div>
  );
}

      <div className="px-5">

function Tickets({ back, onBook }) {
  const [mode, setMode] = useState("bus");
  const [from, setFrom] = useState("Bamako");
  const [to, setTo] = useState("Sikasso");
  const [date, setDate] = useState("2026-08-02");
  const [returnDate, setReturnDate] = useState("2026-08-09");
  const [tripType, setTripType] = useState("aller");
  const [passengers, setPassengers] = useState(1);
  const [searched, setSearched] = useState(false);
  const [results, setResults] = useState([]);
  const [loading, setLoading] = useState(false);

  const accent = mode === "vol" ? "#1B2A4A" : "#C08A3E";
  const isRoundTrip = mode === "vol" && tripType === "aller-retour";

  const doSearch = () => {
    setSearched(true);
    setLoading(true);
    fetchListings(mode === "vol" ? "flight" : "ticket")
      .then(setResults)
      .catch(() => setResults([]))
      .finally(() => setLoading(false));
  };

  const roundTripPrice = (price) => {
    const num = parseInt(price.replace(/[^\d]/g, ""), 10);
    const total = Math.round((num * 1.8) / 1000) * 1000;
    return total.toLocaleString("fr-FR").replace(/,/g, " ") + " FCFA";
  };

  const switchMode = (m) => {
    setMode(m);
    setSearched(false);
    setResults([]);
    setTripType("aller");
    setTo(m === "vol" ? "Dakar" : "Sikasso");
  };

  return (
    <div className="pb-8">
      <TopBar title="Billets" onBack={back} />

      <div className="px-5 grid grid-cols-2 gap-2 mb-1">
        <button onClick={() => switchMode("vol")} className="rounded-xl py-2.5 flex items-center justify-center gap-2 border"
          style={{ borderColor: mode === "vol" ? "#C08A3E" : "#00000015", background: mode === "vol" ? "#C08A3E" : "#fff" }}>
          <span>✈️</span>
          <span className="text-xs font-medium" style={{ color: mode === "vol" ? "#fff" : "#1B2A4A" }}>Vol</span>
        </button>
        <button onClick={() => switchMode("bus")} className="rounded-xl py-2.5 flex items-center justify-center gap-2 border"
          style={{ borderColor: mode === "bus" ? "#C08A3E" : "#00000015", background: mode === "bus" ? "#C08A3E" : "#fff" }}>
          <span>🚌</span>
          <span className="text-xs font-medium" style={{ color: mode === "bus" ? "#fff" : "#1B2A4A" }}>Bus</span>
        </button>
      </div>

      <div className="px-5 flex flex-col gap-3 mt-3">
        <Field emoji="📍" label="Origine">
          <input value={from} onChange={(e) => setFrom(e.target.value)} className="w-full min-w-0 text-sm outline-none bg-transparent" style={{ color: "#1B2A4A" }} />
        </Field>
        <Field emoji="📍" label="Destination">
          <input
            value={to}
            onChange={(e) => setTo(e.target.value)}
            list="destinations-bus"
            className="w-full text-sm outline-none bg-transparent"
            style={{ color: "#1B2A4A" }}
          />
          {mode === "bus" && (
            <datalist id="destinations-bus">
              <option value="Kayes" />
              <option value="Sikasso" />
              <option value="Ségou" />
              <option value="Mopti / Sévaré" />
              <option value="Gao" />
              <option value="Tombouctou" />
              <option value="Nioro du Sahel" />
              <option value="Koutiala" />
              <option value="Ouagadougou (Burkina Faso)" />
              <option value="Niamey (Niger)" />
              <option value="Dakar (Sénégal)" />
              <option value="Abidjan (Côte d'Ivoire)" />
            </datalist>
          )}
          {mode === "vol" && (
            <datalist id="destinations-bus">
              <option value="Dakar (Sénégal)" />
              <option value="Abidjan (Côte d'Ivoire)" />
              <option value="Lomé (Togo)" />
              <option value="Casablanca (Maroc)" />
              <option value="Nouakchott (Mauritanie)" />
              <option value="Addis-Abeba (Éthiopie)" />
              <option value="Tunis (Tunisie)" />
              <option value="Istanbul (Turquie)" />
              <option value="Paris (France)" />
              <option value="Conakry (Guinée)" />
              <option value="Gao" />
              <option value="Kayes" />
              <option value="Mopti" />
              <option value="Tombouctou" />
            </datalist>
          )}
        </Field>
        {mode === "vol" && (
          <div className="grid grid-cols-2 gap-2">
            <button onClick={() => setTripType("aller")} className="rounded-xl py-2 flex items-center justify-center gap-1.5 border"
              style={{ borderColor: tripType === "aller" ? "#C08A3E" : "#00000015", background: tripType === "aller" ? "#C08A3E" : "#fff" }}>
              <span className="text-xs font-medium" style={{ color: tripType === "aller" ? "#fff" : "#1B2A4A" }}>Aller simple</span>
            </button>
            <button onClick={() => setTripType("aller-retour")} className="rounded-xl py-2 flex items-center justify-center gap-1.5 border"
              style={{ borderColor: tripType === "aller-retour" ? "#C08A3E" : "#00000015", background: tripType === "aller-retour" ? "#C08A3E" : "#fff" }}>
              <span className="text-xs font-medium" style={{ color: tripType === "aller-retour" ? "#fff" : "#1B2A4A" }}>Aller-retour</span>

          </div>

        {isRoundTrip ? (
          <>

            <Field emoji="📅" label="Retour">
              <input type="date" value={returnDate} onChange={(e) => setReturnDate(e.target.value)} className="w-full min-w-0 text-sm outline-none bg-transparent" style={{ color: "#1B2A4A" }} />
            </Field>
          </>

          <div className="flex gap-3">
            <div className="flex-1 min-w-0">

              </Field>
            </div>
            <div className="flex-1 min-w-0">
              <Field emoji="👥" label={mode === "vol" ? "Passagers" : "Places"}>
                <div className="flex items-center gap-3">
                  <button onClick={() => setPassengers(Math.max(1, passengers - 1))} className="w-6 h-6 rounded-full bg-black/5 text-sm">−</button>
                  <span className="text-sm" style={{ color: "#1B2A4A" }}>{passengers}</span>
                  <button onClick={() => setPassengers(passengers + 1)} className="w-6 h-6 rounded-full bg-black/5 text-sm">+</button>
                </div>
              </Field>
            </div>
          </div>
        )}
        {isRoundTrip && (
          <Field emoji="👥" label="Passagers">
            <div className="flex items-center gap-3">
              <button onClick={() => setPassengers(Math.max(1, passengers - 1))} className="w-6 h-6 rounded-full bg-black/5 text-sm">−</button>
              <span className="text-sm" style={{ color: "#1B2A4A" }}>{passengers}</span>
              <button onClick={() => setPassengers(passengers + 1)} className="w-6 h-6 rounded-full bg-black/5 text-sm">+</button>
            </div>
          </Field>
        )}
        <button onClick={doSearch} className="rounded-xl py-3 flex items-center justify-center gap-2 mt-2" style={{ background: accent }}>
          <span className="text-white text-sm font-medium">🔍 Rechercher</span>
        </button>
      </div>

      {searched && (
        <div className="px-5 mt-6 flex flex-col gap-3">
          <div className="text-xs uppercase tracking-wide" style={{ color: "#FFFFFF99" }}>
            {from} → {to} {isRoundTrip && `→ ${from}`} · {results.length} {mode === "vol" ? "vols" : "trajets"} · {passengers} {passengers > 1 ? "places" : "place"}
          </div>
          {loading && <div className="text-xs" style={{ color: "#FFFFFF99" }}>Chargement des offres…</div>}
          {!loading && results.length === 0 && (
            <div className="text-xs bg-white/10 rounded-xl p-4" style={{ color: "#FFFFFF99" }}>Aucune offre disponible pour le moment sur ce trajet.</div>
          )}
          {results.map((r, i) => {
            const displayPrice = isRoundTrip ? roundTripPrice(r.price) : r.price;
            return (
              <div key={i} className="bg-white rounded-xl p-4 border border-black/5 flex items-center justify-between">
                <div>
                  <div className="text-sm font-medium" style={{ color: "#1B2A4A" }}>{r.company}</div>
                  <div className="text-xs text-black/40 mt-0.5">{r.depart} — {r.arrive}</div>
                  <div className="text-[11px] mt-0.5" style={{ color: accent }}>{r.detail}{isRoundTrip && " · Aller-retour"}</div>
                </div>
                <div className="text-right">
                  <div className="text-sm" style={{ fontFamily: "'IBM Plex Mono', monospace", color: accent }}>{displayPrice}</div>
                  <button
                    onClick={() => onBook({
                      id: r.id,
                      icon: mode === "vol" ? "✈️" : "🚌",
                      title: r.company,
                      subtitle: isRoundTrip
                        ? `${from} → ${to} → ${from} · ${date} → ${returnDate} · ${r.detail}`
                        : `${from} → ${to} · ${date} · ${r.detail}`,
                      price: displayPrice,
                      priceRaw: r.priceRaw,
                      accent,
                      mode,
                      flightNo: r.flightNo,
                      baggage: r.baggage,
                      from, to, date, depart: r.depart, arrive: r.arrive,
                    })}
                    className="text-xs mt-1"
                    style={{ color: "#1B2A4A" }}
                  >
                    Choisir →
                  </button>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function Taxi({ back, onBook }) {
  const [step, setStep] = useState("form"); // "form" | "vehicle" | "map" (recherche + validation)
  const [vehicleType, setVehicleType] = useState(null); // "moto" | "voiture"
  const [distance, setDistance] = useState("courte"); // "courte" | "moyenne" | "longue"
  const [pickup, setPickup] = useState("Position actuelle");
  const [destination, setDestination] = useState("");
  // Offres "taxi" réelles publiées par les chauffeurs partenaires (via l'admin ou l'app
  // Taama Partenaire). Chaque offre porte metadata.vehicle_type / metadata.distance pour
  // qu'on puisse la faire correspondre au choix du client. Tant qu'aucune offre partenaire
  // n'existe encore pour une combinaison donnée, on retombe sur la grille tarifaire locale
  // (TAXI_PRICES) pour que l'écran reste utilisable pendant la mise en place des chauffeurs.
  const [taxiListings, setTaxiListings] = useState([]);
  const [searching, setSearching] = useState(false);
  const [searchRound, setSearchRound] = useState(0);
  function loadTaxiListings() {
    return apiCall("/listings?type=taxi")
      .then(setTaxiListings)
      .catch((e) => console.error("Impossible de charger les offres taxi :", e.message));
  }
  useEffect(() => { loadTaxiListings(); }, []);
  // Dès que le client a choisi moto ou voiture : recherche d'un chauffeur disponible
  // (on recharge les offres des chauffeurs, puis on affiche le résultat avec le prix).
  useEffect(() => {
    if (step !== "map") return;
    setSearching(true);
    let done = false;
    const started = Date.now();
    loadTaxiListings().finally(() => {
      const wait = Math.max(0, 2200 - (Date.now() - started));
      setTimeout(() => { if (!done) setSearching(false); }, wait);
    });
    return () => { done = true; };
  }, [step, searchRound, vehicleType]);
  function findTaxiListing(vType, dist) {
    return taxiListings.find((l) => l.metadata?.vehicle_type === vType && l.metadata?.distance === dist) || null;
  }

  const accent = "#B5722E";
  const gold = "#C08A3E";
  const matchedListing = vehicleType ? findTaxiListing(vehicleType, distance) : null;
  const priceRaw = matchedListing ? Number(matchedListing.price_fcfa) : (vehicleType ? TAXI_PRICES[vehicleType][distance] : 0);
  const price = formatFCFA(priceRaw);
  const canSearch = destination.trim().length > 0;

  const VEHICLES = [
    { key: "moto", emoji: "🏍️", label: "Moto-taxi", desc: "Déplacez-vous à petits prix", price: findTaxiListing("moto", distance)?.price_fcfa ?? TAXI_PRICES.moto[distance] },
    { key: "voiture", emoji: "🚕", label: "Voiture", desc: "Déplacez-vous confortablement", price: findTaxiListing("voiture", distance)?.price_fcfa ?? TAXI_PRICES.voiture[distance] },
  ];

  const SUGGESTIONS = [
    { label: "Aéroport International Modibo Keïta", sub: "Bamako, Mali" },
    { label: "ACI 2000", sub: "Bamako, Mali" },
    { label: "Marché de Médine", sub: "Bamako, Mali" },
  ];

  function confirmBooking() {
    onBook({
      // Si un chauffeur partenaire a une offre correspondante, on la réserve pour de vrai
      // (id présent -> passe par le flux de réservation normal, visible dans son app et
      // dans l'admin). Sinon on reste sur le mode indicatif, sans chauffeur assigné.
      id: matchedListing?.id,
      icon: vehicleType === "moto" ? "🏍️" : "🚕",
      title: `Taxi · ${vehicleType === "moto" ? "Moto-taxi" : "Voiture"}`,
      subtitle: `${pickup} → ${destination}`,
      price,
      priceRaw,
      accent,
      mode: "taxi",
    });
  }

  // ÉTAPE 1 — Votre trajet
  if (step === "form") {
    return (
      <div className="pb-8">
        <TopBar title="Votre trajet" onBack={back} />
        <div className="px-5 flex flex-col gap-3">
          <Field emoji="🧭" label="Position actuelle">
            <input value={pickup} onChange={(e) => setPickup(e.target.value)} className="w-full min-w-0 text-sm outline-none bg-transparent" style={{ color: "#1B2A4A" }} />
          </Field>
          <Field emoji="🏁" label="Choisir une destination">
            <input value={destination} onChange={(e) => setDestination(e.target.value)} placeholder="Où allez-vous ?" className="w-full min-w-0 text-sm outline-none bg-transparent" style={{ color: "#1B2A4A" }} />
          </Field>
        </div>

        <div className="px-5 mt-6">
          <div className="text-[11px] uppercase tracking-wide mb-2" style={{ color: "#F0ECE199" }}>Destinations suggérées</div>
          <div className="flex flex-col">
            {SUGGESTIONS.map((s) => (
              <button key={s.label} onClick={() => setDestination(s.label)} className="flex items-center gap-3 py-2.5 text-left border-b" style={{ borderColor: "#F0ECE114" }}>
                <span className="w-8 h-8 rounded-lg flex items-center justify-center text-sm shrink-0" style={{ background: "#F0ECE114" }}>🕓</span>
                <div className="min-w-0">
                  <div className="text-sm truncate" style={{ color: "#F0ECE1" }}>{s.label}</div>
                  <div className="text-[11px]" style={{ color: "#F0ECE199" }}>{s.sub}</div>
                </div>
              </button>
            ))}
          </div>
        </div>

        <div className="px-5 mt-6">
          <button onClick={() => canSearch && setStep("vehicle")} disabled={!canSearch} className="w-full rounded-xl py-3 text-sm font-medium text-white" style={{ background: accent, opacity: canSearch ? 1 : 0.5 }}>
            Rechercher un trajet
          </button>
        </div>
      </div>
    );
  }

  // ÉTAPE 2 — Choix du véhicule
  if (step === "vehicle") {
    return (
      <div className="pb-8">
        <TopBar title="Choisir une course" onBack={() => setStep("form")} />
        <div className="px-5">
          <div className="text-[11px] uppercase tracking-wide mb-3" style={{ color: "#F0ECE199" }}>Quel type de course voulez-vous ?</div>
          <div className="flex flex-col gap-2.5">
            {VEHICLES.map((o) => (
              <button key={o.key} onClick={() => { setVehicleType(o.key); setStep("map"); }} className="rounded-2xl px-4 py-3.5 flex items-center justify-between border text-left"
                style={{ borderColor: "#F0ECE125", background: "transparent" }}>
                <div className="flex items-center gap-3">
                  <span className="text-2xl">{o.emoji}</span>
                  <div>
                    <div className="text-sm" style={{ color: "#F0ECE1", fontFamily: "'Fraunces', serif", fontWeight: 600 }}>{o.label}</div>
                    <div className="text-[11px]" style={{ color: "#F0ECE199" }}>{o.desc}</div>
                  </div>
                </div>
                <div className="text-sm" style={{ color: gold, fontFamily: "'IBM Plex Mono', monospace" }}>{formatFCFA(o.price)}</div>
              </button>
            ))}
          </div>
        </div>
      </div>
    );
  }

  // ÉTAPE 3 — Recherche d'un chauffeur, puis validation (le paiement vient après)
  const vehicleLabel = vehicleType === "moto" ? "Moto-taxi" : "Voiture";
  const vehicleEmoji = vehicleType === "moto" ? "🏍️" : "🚕";
  return (
    <div className="pb-8">
      <TopBar title={searching ? "Recherche d'un chauffeur" : (matchedListing ? "Chauffeur trouvé" : "Aucun chauffeur")} onBack={() => setStep("vehicle")} />
      <div className="mx-5 rounded-2xl overflow-hidden relative" style={{ height: 230, background: "#0B1526" }}>
        <div className="absolute inset-0" style={{
          backgroundImage: "linear-gradient(#F0ECE114 1px, transparent 1px), linear-gradient(90deg, #F0ECE114 1px, transparent 1px)",
          backgroundSize: "26px 26px",
        }} />
        <span className="absolute text-sm opacity-40" style={{ top: 28, left: 22 }}>🏥</span>
        <span className="absolute text-sm opacity-40" style={{ top: 54, right: 30 }}>🎓</span>
        <span className="absolute text-sm opacity-40" style={{ bottom: 36, left: 40 }}>🏫</span>
        {(searching || matchedListing) && (
          <span className={"absolute text-lg" + (searching ? " taxi-drive-icon" : "")} style={{ top: "58%", left: "30%" }}>{vehicleEmoji}</span>
        )}
        <div className="absolute" style={{ top: "46%", left: "50%", transform: "translate(-50%,-50%)" }}>
          <div className="rounded-full taxi-pulse-marker" style={{ width: 14, height: 14, background: gold }} />
        </div>
      </div>

      <div className="px-5 mt-4">
        {searching ? (
          <div className="rounded-2xl px-4 py-5 text-center" style={{ background: "#1B2A4A" }}>
            <div className="text-sm" style={{ color: "#F0ECE1", fontFamily: "'Fraunces', serif", fontWeight: 600 }}>Recherche d'un chauffeur {vehicleType === "moto" ? "moto-taxi" : "voiture"}…</div>
            <div className="text-[11px] mt-1" style={{ color: "#F0ECE199" }}>{pickup} → {destination}</div>
          </div>
        ) : matchedListing ? (
          <div className="rounded-2xl p-4" style={{ background: "#1B2A4A" }}>
            <div className="flex items-center gap-3">
              <span className="w-11 h-11 rounded-full flex items-center justify-center text-xl shrink-0" style={{ background: "#F0ECE114" }}>{vehicleEmoji}</span>
              <div className="min-w-0 flex-1">
                <div className="text-sm truncate" style={{ color: "#F0ECE1", fontFamily: "'Fraunces', serif", fontWeight: 600 }}>{matchedListing.title}</div>
                <div className="text-[11px]" style={{ color: "#F0ECE199" }}>
                  {vehicleLabel}{matchedListing.metadata?.plate ? " · " + matchedListing.metadata.plate : ""}{matchedListing.metadata?.city ? " · " + matchedListing.metadata.city : ""}
                </div>
              </div>
              <div className="text-right shrink-0">
                <div className="text-base" style={{ color: gold, fontFamily: "'IBM Plex Mono', monospace" }}>{price}</div>
                <div className="text-[10px]" style={{ color: "#F0ECE199" }}>prix de la course</div>
              </div>
            </div>
            <div className="mt-3 pt-3 border-t text-[11px] flex flex-col gap-1" style={{ borderColor: "#F0ECE11F", color: "#F0ECE1CC" }}>
              <div>🧭 {pickup}</div>
              <div>🏁 {destination}</div>
            </div>
          </div>
        ) : (
          <div className="rounded-2xl px-4 py-5 text-center" style={{ background: "#1B2A4A" }}>
            <div className="text-sm" style={{ color: "#F0ECE1", fontFamily: "'Fraunces', serif", fontWeight: 600 }}>Aucun chauffeur {vehicleType === "moto" ? "moto-taxi" : "voiture"} disponible pour le moment</div>
            <div className="text-[11px] mt-1" style={{ color: "#F0ECE199" }}>Réessayez dans quelques instants ou choisissez un autre véhicule. Vous ne payez rien tant qu'aucun chauffeur n'est trouvé.</div>
          </div>
        )}
      </div>

      <div className="px-5 mt-4 flex flex-col gap-2">
        {!searching && matchedListing && (
          <button onClick={confirmBooking} className="w-full rounded-xl py-3.5 text-sm font-medium" style={{ background: gold, color: "#1B2A4A" }}>
            Valider ce chauffeur et payer {price}
          </button>
        )}
        {!searching && !matchedListing && (
          <>
            <button onClick={() => setSearchRound((n) => n + 1)} className="w-full rounded-xl py-3 text-sm font-medium text-white" style={{ background: accent }}>
              Relancer la recherche
            </button>
            <button onClick={() => setStep("vehicle")} className="w-full rounded-xl py-3 text-sm border" style={{ borderColor: "#F0ECE133", color: "#F0ECE1" }}>
              Choisir un autre véhicule
            </button>
          </>
        )}
      </div>
    </div>
  );
}

function BusPassengerForm({ item, back, onNext }) {

  return (
    <div className="pb-8">
      <TopBar title="Informations passager" onBack={back} />

          <div className="text-sm font-medium" style={{ color: "#FFFFFF" }}>{item.title}</div>
          <div className="text-xs mt-0.5" style={{ color: "#FFFFFFb3" }}>{item.subtitle}</div>

const OPTION_PRICES = {
  bagage: 15000,
  siege: 5000,
  repas: 7000,
  assistance: 10000,
  assurance: 12000,
};

function TripOptions({ item, back, onNext }) {
  const [opts, setOpts] = useState({ bagage: false, siege: false, repas: false, assistance: false, assurance: false });
  const toggle = (k) => setOpts({ ...opts, [k]: !opts[k] });
  const rows = [
    { key: "bagage", label: "Bagage supplémentaire", emoji: "🧳" },
    { key: "siege", label: "Choix du siège", emoji: "💺" },
    { key: "repas", label: "Repas spécial", emoji: "🍽️" },
    { key: "assistance", label: "Assistance à l'aéroport", emoji: "🧑‍✈️" },
    { key: "assurance", label: "Assurance voyage", emoji: "🛡️" },
  ];
  return (
    <div className="pb-8">
      <TopBar title="Options du voyage" onBack={back} />
      <div className="px-5 flex flex-col gap-2">
        {rows.map((r) => (
          <button
            key={r.key}
            onClick={() => toggle(r.key)}
            className="bg-white rounded-xl p-4 flex items-center justify-between border"
            style={{ borderColor: opts[r.key] ? item.accent : "#00000015" }}
          >
            <div className="flex items-center gap-3">
              <span className="text-lg">{r.emoji}</span>
              <span className="text-sm font-medium" style={{ color: "#1B2A4A" }}>{r.label}</span>
            </div>
            <div className="flex items-center gap-2">
              <span className="text-xs" style={{ fontFamily: "'IBM Plex Mono', monospace", color: "#1B2A4A" }}>
                +{OPTION_PRICES[r.key].toLocaleString("fr-FR")} FCFA
              </span>
              <div
                className="w-5 h-5 rounded-full flex items-center justify-center text-[10px]"
                style={{ background: opts[r.key] ? item.accent : "#00000010", color: "#fff" }}
              >
                {opts[r.key] ? "✓" : ""}
              </div>
            </div>
          </button>
        ))}
        <button
          onClick={() => onNext(opts)}
          className="w-full rounded-xl py-3 mt-4"
          style={{ background: item.accent }}
        >
          <span className="text-white text-sm font-medium">Continuer</span>
        </button>
      </div>
    </div>
  );
}

function TripRecap({ item, passenger, contact, options, back, onNext }) {
  const basePrice = parsePriceFcfa(item.price);
  const taxes = Math.round(basePrice * 0.05);
  const serviceFee = 1500;
  const optionsTotal = Object.keys(options).reduce((sum, k) => sum + (options[k] ? OPTION_PRICES[k] : 0), 0);
  const total = basePrice + taxes + serviceFee + optionsTotal;
  const optionLabels = { bagage: "Bagage supplémentaire", siege: "Choix du siège", repas: "Repas spécial", assistance: "Assistance aéroport", assurance: "Assurance voyage" };
  const activeOptions = Object.keys(options).filter((k) => options[k]);

  return (
    <div className="pb-8">
      <TopBar title="Récapitulatif" onBack={back} />
      <div className="px-5 flex flex-col gap-4">
        <div className="bg-white rounded-xl p-4 border border-black/5">
          <div className="text-xs uppercase tracking-wide text-black/40 mb-2">Votre voyage</div>
          <div className="text-sm font-medium" style={{ color: "#1B2A4A" }}>{item.from} → {item.to}</div>
          <div className="text-xs text-black/40 mt-1">{item.date} · {item.depart} — {item.arrive}</div>
          <div className="text-xs text-black/40">{item.title}{item.flightNo ? ` · Vol ${item.flightNo}` : ""}</div>
        </div>

        <div className="bg-white rounded-xl p-4 border border-black/5">
          <div className="text-xs uppercase tracking-wide text-black/40 mb-2">Passager</div>
          <div className="text-sm font-medium" style={{ color: "#1B2A4A" }}>{passenger.prenoms} {passenger.nom}</div>
          <div className="text-xs text-black/40 mt-1">1 voyageur</div>
        </div>

        {activeOptions.length > 0 && (
          <div className="bg-white rounded-xl p-4 border border-black/5">
            <div className="text-xs uppercase tracking-wide text-black/40 mb-2">Options</div>
            {activeOptions.map((k) => (
              <div key={k} className="flex items-center justify-between text-sm mt-1" style={{ color: "#1B2A4A" }}>
                <span>{optionLabels[k]}</span>
                <span style={{ fontFamily: "'IBM Plex Mono', monospace" }}>{OPTION_PRICES[k].toLocaleString("fr-FR")} FCFA</span>
              </div>
            ))}
          </div>
        )}

        <div className="bg-white rounded-xl p-4 border border-black/5">
          <div className="text-xs uppercase tracking-wide text-black/40 mb-2">Prix</div>
          <div className="flex items-center justify-between text-sm mt-1" style={{ color: "#1B2A4A" }}>
            <span>Prix du billet</span><span style={{ fontFamily: "'IBM Plex Mono', monospace" }}>{basePrice.toLocaleString("fr-FR")} FCFA</span>
          </div>
          <div className="flex items-center justify-between text-sm mt-1" style={{ color: "#1B2A4A" }}>
            <span>Taxes</span><span style={{ fontFamily: "'IBM Plex Mono', monospace" }}>{taxes.toLocaleString("fr-FR")} FCFA</span>
          </div>
          <div className="flex items-center justify-between text-sm mt-1" style={{ color: "#1B2A4A" }}>
            <span>Frais de service Taama</span><span style={{ fontFamily: "'IBM Plex Mono', monospace" }}>{serviceFee.toLocaleString("fr-FR")} FCFA</span>
          </div>
          {optionsTotal > 0 && (
            <div className="flex items-center justify-between text-sm mt-1" style={{ color: "#1B2A4A" }}>
              <span>Options supplémentaires</span><span style={{ fontFamily: "'IBM Plex Mono', monospace" }}>{optionsTotal.toLocaleString("fr-FR")} FCFA</span>
            </div>
          )}
          <div className="flex items-center justify-between text-base font-medium mt-3 pt-3 border-t border-black/5" style={{ color: item.accent }}>
            <span>TOTAL À PAYER</span><span style={{ fontFamily: "'IBM Plex Mono', monospace" }}>{total.toLocaleString("fr-FR")} FCFA</span>
          </div>
        </div>

        <button
          onClick={() => onNext(total)}
          className="w-full rounded-xl py-3"
          style={{ background: item.accent }}
        >
          <span className="text-white text-sm font-medium">Procéder au paiement</span>
        </button>
      </div>
    </div>
  );
}

  const handlePay = async () => {
    setError(null);
    setPaying(true);
    try {
      const payerPhone = method === "card" ? null : (payWith === "compte" ? (user ? user.phone : "") : phone);
      await onPay(method, payerPhone);
    } catch (e) {
      setError(e.message);
    } finally {
      setPaying(false);
    }
  };

    <div className="pb-8">
      <TopBar title="Récapitulatif" onBack={back} />

      <div className="px-5">

      ) : (
        <div className="px-5 mt-4 flex flex-col gap-3">
          <Field emoji="💳" label="Numéro de carte">
            <input placeholder="0000 0000 0000 0000" className="w-full min-w-0 text-sm outline-none bg-transparent" style={{ color: "#1B2A4A" }} />
          </Field>
          <div className="flex gap-3">
            <div className="flex-1">
              <Field emoji="📅" label="Expiration">
                <input placeholder="MM/AA" className="w-full min-w-0 text-sm outline-none bg-transparent" style={{ color: "#1B2A4A" }} />
              </Field>
            </div>
            <div className="flex-1">
              <Field emoji="🔒" label="CVC">
                <input placeholder="000" className="w-full min-w-0 text-sm outline-none bg-transparent" style={{ color: "#1B2A4A" }} />
              </Field>
            </div>
          </div>
        </div>
      )}

      {error && (
        <div className="px-5 mt-4">
          <p className="text-xs" style={{ color: "#A63D2F" }}>{error}</p>
        </div>
      )}

      <div className="px-5 mt-6">
        <button
          onClick={handlePay}
          disabled={paying}
          className="w-full rounded-xl py-3 flex items-center justify-center gap-2"
          style={{ background: item.accent, opacity: paying ? 0.7 : 1 }}
        >
          <span className="text-white text-sm font-medium">
            {paying ? "Traitement en cours…" : `Payer ${item.price}`}
          </span>
        </button>
      </div>
    </div>
  );
}

function Confirmation({ item, reference, passenger, contact, total, goHome }) {
  const isFlight = item.mode === "vol";
  const isBus = item.mode === "bus";
  const isHotel = item.mode === "hotel";
  const isVehicle = item.mode === "vehicle";
  const isTaxi = item.mode === "taxi";
  const isVehicleAvec = isVehicle && item.driver === "avec";
  const amount = total ? total.toLocaleString("fr-FR") + " FCFA" : item.price;
  const mapsQuery = isHotel ? encodeURIComponent(`${item.title} ${item.zone || ""} ${item.city || "Bamako"} Mali`) : "";

  const vehicleAbroadMessage = `Vous arrivez de l'étranger ? N'attendez pas notre appel : composez directement le ${TAAMA_DISPATCH_PHONE} dès votre arrivée pour ${isVehicleAvec ? "être mis en relation avec votre chauffeur" : "récupérer votre véhicule"}. Si l'appel ne passe pas, contactez-nous sur WhatsApp ou par message.`;

  // Chauffeur assigné pour la course taxi (généré une seule fois pour cette confirmation)
  const [driver] = useState(() => {
    const names = ["Moussa Traoré", "Ibrahim Diarra", "Souleymane Sidibé", "Adama Koné", "Boubacar Sangaré", "Youssouf Camara"];

    const plate = `${Math.floor(1000 + Math.random() * 9000)} MJ ${String(Math.floor(Math.random() * 20)).padStart(2, "0")}`;
    return { name, phone, plate };

  const ticketText = isFlight
    ? `Réservation Taama confirmée\nPassager : ${passenger.prenoms} ${passenger.nom}\nCompagnie : ${item.title}${item.flightNo ? " · Vol " + item.flightNo : ""}\nPNR : ${reference}\nDépart : ${item.from} → ${item.to}\nDate : ${item.date} · ${item.depart} — ${item.arrive}\nMontant payé : ${amount}`

    ? `Réservation Taama confirmée\nPassager : ${passenger.prenoms} ${passenger.nom}\nTéléphone : ${contact ? contact.telephone : ""}\nCompagnie : ${item.title}\n${item.subtitle}\nRéférence : ${reference}\nMontant payé : ${amount}`
    : isHotel

    : `Réservation Taama confirmée\n${item.title}\n${item.subtitle}\nRéférence : ${reference}\nMontant payé : ${amount}`;

  const handleDownload = () => {

        <div className="flex items-center justify-between pt-3">

          <span className="text-sm" style={{ fontFamily: "'IBM Plex Mono', monospace", color: item.accent }}>{reference}</span>

        <div className="flex items-center justify-between pt-2">

function MyBookings({ back, bookings }) {
  const [filter, setFilter] = useState("À venir");
  const tabs = ["À venir", "Terminées", "Annulées"];
  const filtered = bookings.filter((b) => {
    if (filter === "À venir") return b.status === "En attente" || b.status === "Confirmé";
    if (filter === "Annulées") return b.status === "Annulé" || b.status === "Rejeté";
    return false; // "Terminées" : nécessite la date du voyage, pas encore disponible côté API
  });

  return (
    <div className="pb-8">
      <TopBar title="Mes réservations" onBack={back} />
      <div className="px-5 flex gap-2 overflow-x-auto pb-1">
        {tabs.map((t) => (
          <button
            key={t}
            onClick={() => setFilter(t)}
            className="text-xs font-medium px-3 py-1.5 rounded-full border whitespace-nowrap"
            style={{
              borderColor: filter === t ? "#C08A3E" : "#00000015",
              background: filter === t ? "#C08A3E" : "#fff",
              color: filter === t ? "#fff" : "#1B2A4A",
            }}
          >
            {t}
          </button>
        ))}
      </div>
      <div className="px-5 mt-4 flex flex-col gap-2">
        {filtered.length === 0 ? (
          <div className="text-sm text-center py-10" style={{ color: "#FFFFFF99" }}>

          </div>

          filtered.map((b, i) => <BookingRow key={i} b={b} />)
        )}
      </div>
    </div>
  );
}

// Convertit un prix affiché ("45 000 FCFA / nuit") en entier FCFA pour l'API
function parsePriceFcfa(priceStr) {
  const digits = String(priceStr).replace(/[^\d]/g, "");
  return parseInt(digits || "0", 10);
}

function TaamaApp() {
  const [token, setToken] = useState(() => localStorage.getItem("taama_client_token"));
  const [user, setUser] = useState(() => {
    const saved = localStorage.getItem("taama_client_user");
    return saved ? JSON.parse(saved) : null;
  });
  const [screen, setScreen] = useState(() => (localStorage.getItem("taama_client_token") ? "home" : "login"));
  const [checkoutItem, setCheckoutItem] = useState(null);
  const [passengerInfo, setPassengerInfo] = useState(null);
  const [contactInfo, setContactInfo] = useState(null);
  const [tripOptionsState, setTripOptionsState] = useState({});
  const [finalTotal, setFinalTotal] = useState(null);
  const [detailItem, setDetailItem] = useState(null);
  const [detailOrigin, setDetailOrigin] = useState("home");
  const [lastReference, setLastReference] = useState(null);
  const [bookings, setBookings] = useState([]);

  const loadBookings = async (authToken) => {
    if (String(authToken).startsWith("local-")) return; // session locale fictive, pas de backend à interroger
    try {
      const data = await apiCall("/bookings", {
        headers: { Authorization: "Bearer " + authToken },
      });
      setBookings(
        data.map((b) => ({
          icon: b.icon,
          title: b.title,
          subtitle: b.subtitle,
          accent: b.accent_color,
          status: b.status,
        }))
      );
    } catch (e) {
      console.error("Impossible de charger les réservations :", e.message);
      if (e.status === 401) handleLogout();
    }
  };

  const handleLoggedIn = (authToken, authUser) => {
    setToken(authToken);
    setUser(authUser);
    localStorage.setItem("taama_client_token", authToken);
    localStorage.setItem("taama_client_user", JSON.stringify(authUser));
    setScreen("home");
    loadBookings(authToken);
  };

  const handleLogout = () => {
    setToken(null);
    setUser(null);
    localStorage.removeItem("taama_client_token");
    localStorage.removeItem("taama_client_user");
    localStorage.removeItem("taama_role"); // au prochain lancement : choix Client / Partenaire
    setScreen("login");
  };

  // Reconnexion automatique : si un token est déjà en mémoire au chargement, on récupère les réservations
  useEffect(() => {
    if (token) loadBookings(token);
  }, []);

  const goHome = () => {
    setCheckoutItem(null);
    setPassengerInfo(null);
    setContactInfo(null);
    setTripOptionsState({});
    setFinalTotal(null);
    setScreen("home");
  };

  // Pour un vol : parcours détaillé (passager -> coordonnées -> options -> récap -> paiement)
  // Pour tout le reste (bus, hôtel, véhicule, assurance) : paiement direct, inchangé
  const handleBook = (item) => {
    setCheckoutItem(item);
    if (item.mode === "vol") {
      setScreen("passenger");
    } else if (item.mode === "taxi") {
      // Le passager est déjà enregistré (compte connecté) : pas de formulaire, paiement direct.
      setPassengerInfo(user ? { nom: user.nom, prenoms: user.prenoms } : null);
      setContactInfo(user ? { nomComplet: `${user.prenoms} ${user.nom}`, telephone: user.phone } : null);
      setScreen("checkout");
    } else if (item.mode === "bus" || item.mode === "hotel") {
      setScreen("buspassenger");
    } else if (item.mode === "vehicle") {
      setScreen("contract");
    } else {
      setScreen("checkout");
    }
  };

  const handleViewDetail = (item) => {
    setDetailItem(item);
    setDetailOrigin(screen);
    setScreen("detail");
  };

  // Crée la réservation réelle, liée à l'offre déjà validée et à l'utilisateur connecté.
  // Pour les offres sans catalogue (ex. devis d'assurance calculé côté client),
  // on crée encore l'offre à la volée en filet de sécurité.
  const handlePay = async (method, payerPhone) => {
    const listingType = listingTypeFromItem(checkoutItem);
    const pricing = commissionPreview(checkoutItem, finalTotal || checkoutItem.priceRaw || parsePriceFcfa(checkoutItem.price));

    // Taxi sans chauffeur partenaire correspondant pour l'instant (aucune offre "taxi"
    // publiée pour ce couple véhicule/distance) : on reste en paiement fictif plutôt que
    // de tenter une création d'offre à la volée, qui échouerait avec "Non autorisé" (un
    // client n'a pas les droits pour créer une offre). Dès qu'un chauffeur est connecté,
    // checkoutItem.id est renseigné et la réservation suit le flux normal ci-dessous,
    // ce qui la relie réellement au chauffeur et la fait apparaître dans l'admin.
    if (checkoutItem.mode === "taxi" && !checkoutItem.id) {
      const fakeReference = "TX-" + Math.random().toString(36).slice(2, 8).toUpperCase();
      setLastReference(fakeReference);
      setScreen("confirmation");
      return;
    }

    let listingId = checkoutItem.id;
    if (!listingId) {
      const listing = await apiCall("/listings", {
        method: "POST",
        body: JSON.stringify({
          type: listingType,
          title: checkoutItem.title,
          subtitle: checkoutItem.subtitle,
          price_fcfa: finalTotal || parsePriceFcfa(checkoutItem.price),
          icon: checkoutItem.icon,
          accent_color: checkoutItem.accent,
          partner_name: checkoutItem.agency,
        }),
      });
      listingId = listing.id;
    }

    const booking = await apiCall("/bookings", {
      method: "POST",
      headers: { Authorization: "Bearer " + token },
      body: JSON.stringify({
        listing_id: listingId,
        payment_method: method,
        payer_phone: payerPhone || null,
        passenger_name: passengerInfo ? `${passengerInfo.prenoms} ${passengerInfo.nom}` : null,
        passenger_document: (passengerInfo && passengerInfo.docType) ? `${passengerInfo.docType} · ${passengerInfo.docNumero}` : null,
        contact_phone: contactInfo ? contactInfo.telephone : null,
        contact_email: contactInfo ? contactInfo.email : null,
        options: tripOptionsState,
      }),
    });

    // Journal local pour l'interface : le montant définitif de la commission doit être recalculé côté serveur.
    try {
      const journal = JSON.parse(localStorage.getItem("taama_commission_journal") || "[]");
      journal.push({ reference: booking.reference, listing_type: listingType, gross_fcfa: Number(pricing.amount + pricing.partnerNet), commission_rate: pricing.rate, commission_fcfa: pricing.amount, partner_net_fcfa: pricing.partnerNet, created_at: new Date().toISOString() });
      localStorage.setItem("taama_commission_journal", JSON.stringify(journal.slice(-500)));
    } catch (_) {}

    setLastReference(booking.reference);
    await loadBookings(token);
    setScreen("confirmation");
  };

  const screens = {
    login: <Login onLoggedIn={handleLoggedIn} />,
    home: <Home go={setScreen} bookings={bookings} onLogout={handleLogout} />,
    tickets: <Tickets back={() => setScreen("home")} onBook={handleBook} />,
    hotels: <Hotels back={() => setScreen("home")} onBook={handleBook} onViewDetail={handleViewDetail} />,
    vehicles: <Vehicles back={() => setScreen("home")} onBook={handleBook} onViewDetail={handleViewDetail} />,
    insurance: <Insurance back={() => setScreen("home")} onBook={handleBook} />,
    taxi: <Taxi back={() => setScreen("home")} onBook={handleBook} />,
    detail: detailItem && <ItemDetail item={detailItem} back={() => setScreen(detailOrigin)} onBook={handleBook} />,
    passenger: checkoutItem && (
      <PassengerForm
        item={checkoutItem}
        back={() => setScreen("tickets")}
        onNext={(p) => { setPassengerInfo(p); setScreen("contact"); }}
      />
    ),
    buspassenger: checkoutItem && (
      <BusPassengerForm
        item={checkoutItem}
        back={() => setScreen(checkoutItem.mode === "hotel" ? "hotels" : checkoutItem.mode === "vehicle" ? "contract" : checkoutItem.mode === "taxi" ? "taxi" : "tickets")}
        onNext={(p) => {
          setPassengerInfo({ nom: p.nom, prenoms: p.prenoms });
          setContactInfo({ nomComplet: `${p.prenoms} ${p.nom}`, telephone: p.telephone });
          setScreen("checkout");
        }}
      />
    ),
    contract: checkoutItem && (
      <VehicleContract
        item={checkoutItem}
        back={() => setScreen("vehicles")}
        onNext={() => setScreen("buspassenger")}
      />
    ),
    contact: checkoutItem && (
      <ContactForm
        item={checkoutItem}
        back={() => setScreen("passenger")}
        onNext={(c) => { setContactInfo(c); setScreen("options"); }}
      />
    ),
    options: checkoutItem && (
      <TripOptions
        item={checkoutItem}
        back={() => setScreen("contact")}
        onNext={(o) => { setTripOptionsState(o); setScreen("recap"); }}
      />
    ),
    recap: checkoutItem && passengerInfo && contactInfo && (
      <TripRecap
        item={checkoutItem}
        passenger={passengerInfo}
        contact={contactInfo}
        options={tripOptionsState}
        back={() => setScreen("options")}
        onNext={(total) => { setFinalTotal(total); setScreen("checkout"); }}
      />
    ),
    checkout: checkoutItem && (
      <Checkout
        item={checkoutItem}
        user={user}
        back={() => setScreen(checkoutItem.mode === "vol" ? "recap" : checkoutItem.mode === "taxi" ? "taxi" : (checkoutItem.mode === "bus" || checkoutItem.mode === "hotel" || checkoutItem.mode === "vehicle") ? "buspassenger" : "home")}
        onPay={handlePay}
      />
    ),
    confirmation: checkoutItem && (
      <Confirmation
        item={checkoutItem}
        reference={lastReference}
        passenger={passengerInfo}
        contact={contactInfo}
        total={finalTotal}
        goHome={goHome}
      />
    ),
    mybookings: <MyBookings back={() => setScreen("home")} bookings={bookings} />,
  };
  return (
    <div className="min-h-screen w-full flex justify-center" style={{ background: "#0B1526" }}>
      <div className="w-full max-w-[480px] min-h-screen" style={{ background: "#13223D", color: "#F0ECE1" }}>
        {screens[screen]}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<TaamaApp />);
</script>
<!-- ============ Installation (téléphone / ordinateur) ============ -->
<style>
  /* Bandeau d'installation : compact, en haut de la première page */
  #taama-install { position: fixed; left: 50%; top: max(10px, calc(env(safe-area-inset-top) + 6px)); transform: translateX(-50%); z-index: 10001;
    width: calc(100% - 24px); max-width: 440px; background: #0A1F3D; color: #F0ECE1; border: 1px solid #C08A3E;
    border-radius: 14px; padding: 9px 10px 9px 12px; box-shadow: 0 10px 30px rgba(0,0,0,.4);
    font-family: 'Work Sans', system-ui, sans-serif; font-size: 12.5px; line-height: 1.45; box-sizing: border-box; }
  #taama-install[hidden] { display: none; }
  #taama-install b { color: #E8CD7A; }
  #taama-install .ti-row { display: flex; align-items: center; gap: 10px; }
  #taama-install .ti-ico { width: 34px; height: 34px; border-radius: 50%; background: #fff; flex-shrink: 0; }
  #taama-install .ti-title { flex: 1; font-weight: 700; font-size: 13.5px; color: #fff; line-height: 1.25; }
  #taama-install .ti-title small { display: block; font-weight: 500; font-size: 11.5px; color: #9AA6BD; }
  #taama-install .ti-btn { background: #D4AF37; color: #0A1F3D; border: none; border-radius: 999px; padding: 8px 14px; font-weight: 800; font-size: 13px; cursor: pointer; flex-shrink: 0; }
  #taama-install .ti-close { background: none; border: none; color: #9AA6BD; font-size: 20px; cursor: pointer; padding: 0 2px; flex-shrink: 0; }
  #taama-install #ti-text { margin-top: 8px; }
  body.has-install #taama-role .tr-wrap { padding-top: calc(var(--inst-h, 56px) + 26px); }
  body.has-install #taama-role .tr-logo { width: 64px; height: 64px; }
  body.has-install #taama-role .tr-brand { font-size: 22px; }
  body.has-install #taama-role h1 { margin-top: 18px; }
</style>
<div id="taama-install" hidden>
  <div class="ti-row">
    <img class="ti-ico" src="icon-192.png" alt="">
    <span class="ti-title">Installer l'application Taama<small>Accès rapide depuis l'écran d'accueil</small></span>
    <button class="ti-btn" id="ti-btn" type="button">Installer</button>
    <button class="ti-close" id="ti-close" type="button" aria-label="Fermer">×</button>
  </div>
  <div id="ti-text" hidden></div>
</div>
<script>
(function () {
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
  var box = document.getElementById("taama-install"), text = document.getElementById("ti-text"), btn = document.getElementById("ti-btn");
  var installed = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone;
  // Tant que l'application n'est pas installée, le bandeau revient à chaque
  // ouverture, actualisation ou retour à l'accueil. Une fois installée : plus jamais.
  if (installed || location.protocol === "file:") return;
  function fit() { document.documentElement.style.setProperty("--inst-h", box.offsetHeight + "px"); }
  function showBox() { box.hidden = false; document.body.classList.add("has-install"); fit(); }
  function hideBox() { box.hidden = true; document.body.classList.remove("has-install"); }
  window.addEventListener("resize", function () { if (!box.hidden) fit(); });
  var ua = navigator.userAgent;
  var isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/.test(ua);
  if (isIOS) text.innerHTML = "Dans <b>Safari</b>, touchez <b>Partager</b> (carré avec une flèche) puis <b>« Sur l'écran d'accueil »</b>.";
  else if (isAndroid) text.innerHTML = "Ouvrez le menu <b>⋮</b> de Chrome, puis touchez <b>« Installer l'application »</b> ou <b>« Ajouter à l'écran d'accueil »</b>.";
  else text.innerHTML = "Cliquez sur l'icône <b>Installer</b> dans la barre d'adresse du navigateur.";
  function onHome() { return document.body.classList.contains("role-open"); }
  function refresh() { if (onHome()) { text.hidden = true; showBox(); } else hideBox(); }
  refresh(); // dès l'ouverture, sur la page d'accueil
  window.addEventListener("taama-role-change", refresh);
  var deferred = null;
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); deferred = e; });
  btn.addEventListener("click", function () {
    if (deferred) { // Android / ordinateur : fenêtre d'installation du téléphone
      deferred.prompt();
      deferred.userChoice.then(function (c) { if (c && c.outcome === "accepted") hideBox(); }).catch(function () {});
      deferred = null;
    } else { // iPhone, ou navigateur sans installation automatique : on explique
      text.hidden = !text.hidden; fit();
    }
  });
  document.getElementById("ti-close").addEventListener("click", function () {
    hideBox(); // reviendra au prochain retour à l'accueil
  });
  window.addEventListener("appinstalled", function () { installed = true; hideBox(); window.removeEventListener("taama-role-change", refresh); });
})();
</script>
